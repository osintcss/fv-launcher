name: Build and Release Launcher

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: launcher-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            command: npm run build:win
            asset_path: dist/*.exe
            artifact_name: launcher-windows
          - name: macOS
            os: macos-latest
            command: npm run build:mac
            asset_path: dist/*-macos-*.zip
            artifact_name: launcher-macos
          - name: Linux
            os: ubuntu-latest
            command: npm run build:linux
            asset_path: dist/*.AppImage
            artifact_name: launcher-linux

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Stamp release version
        run: npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Build launcher
        run: ${{ matrix.command }}

      - name: Upload release asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged launchers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FV Launcher v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: release-assets/*
